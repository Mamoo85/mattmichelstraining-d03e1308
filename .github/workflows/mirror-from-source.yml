name: Mirror from mamoo85/m2training

# Pulls changes from the source-of-truth repo (mamoo85/m2training) into the
# Lovable-managed repo and opens an automatic PR. Reports merge status back.
#
# Required secrets:
#   SOURCE_REPO_TOKEN  - PAT with `repo` scope on mamoo85/m2training (read)
#                        and on this repo (write + pull-requests).
#
# Runs every 15 minutes and on manual dispatch.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: mirror-from-source
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Lovable repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "lovable-mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"

      - name: Add source remote and fetch
        env:
          TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SOURCE_REPO_TOKEN secret is not set. Add a PAT with read access to mamoo85/m2training."
            exit 1
          fi
          git remote add source "https://x-access-token:${TOKEN}@github.com/mamoo85/m2training.git"
          git fetch source main

      - name: Detect changes
        id: diff
        run: |
          AHEAD=$(git rev-list --count HEAD..source/main || echo 0)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "Source is $AHEAD commits ahead of Lovable main."
      - name: Create mirror branch
        if: steps.diff.outputs.ahead != '0'
        id: branch
        run: |
          BRANCH="mirror/source-$(date -u +%Y%m%d-%H%M%S)"
          git reset --hard HEAD
          git clean -fd
          git checkout -B "$BRANCH" source/main --force

          # Scrub secrets that GitHub Push Protection blocks across ALL tracked
          # text files in the source tree (not just a hardcoded allowlist).
          # Skips binaries, lockfiles, and node_modules/dist/build dirs.
          echo "Scanning tracked files for secret patterns..."
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              node_modules/*|dist/*|build/*|.next/*|*.lock|*.lockb|package-lock.json|yarn.lock|bun.lockb|pnpm-lock.yaml) continue ;;
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.pdf|*.zip|*.tar|*.gz|*.mp4|*.mov|*.woff|*.woff2|*.ttf|*.otf|*.eot) continue ;;
            esac
            # Skip binary files
            if [ -f "$f" ] && file "$f" 2>/dev/null | grep -q "text\|empty\|JSON\|XML\|HTML\|script\|source"; then
              perl -i -pe '
                s/ghp_[A-Za-z0-9]{20,}/ghp_REDACTED/g;
                s/gho_[A-Za-z0-9]{20,}/gho_REDACTED/g;
                s/ghu_[A-Za-z0-9]{20,}/ghu_REDACTED/g;
                s/ghs_[A-Za-z0-9]{20,}/ghs_REDACTED/g;
                s/ghr_[A-Za-z0-9]{20,}/ghr_REDACTED/g;
                s/github_pat_[A-Za-z0-9_]{20,}/github_pat_REDACTED/g;
                s/sk-ant-[A-Za-z0-9_\-]{20,}/sk-ant-REDACTED/g;
                s/sk-proj-[A-Za-z0-9_\-]{20,}/sk-proj-REDACTED/g;
                s/sk-[A-Za-z0-9]{32,}/sk-REDACTED/g;
                s/sk_live_[A-Za-z0-9]{20,}/sk_live_REDACTED/g;
                s/sk_test_[A-Za-z0-9]{20,}/sk_test_REDACTED/g;
                s/rk_live_[A-Za-z0-9]{20,}/rk_live_REDACTED/g;
                s/pk_live_[A-Za-z0-9]{20,}/pk_live_REDACTED/g;
                s/whsec_[A-Za-z0-9]{20,}/whsec_REDACTED/g;
                s/AIza[0-9A-Za-z_\-]{30,}/AIza_REDACTED/g;
                s/AKIA[0-9A-Z]{16}/AKIA_REDACTED/g;
                s/ASIA[0-9A-Z]{16}/ASIA_REDACTED/g;
                s/xox[baprs]-[A-Za-z0-9\-]{20,}/xox-REDACTED/g;
                s/eyJ[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}/eyJ.REDACTED.JWT/g;
                s/SG\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}/SG.REDACTED/g;
                s/AC[a-f0-9]{32}/AC_REDACTED_TWILIO_SID/g;
                s/SK[a-f0-9]{32}/SK_REDACTED_TWILIO_KEY/g;
                s/re_[A-Za-z0-9_]{20,}/re_REDACTED/g;
                s/key-[a-f0-9]{32}/key-REDACTED/g;
              ' "$f" 2>/dev/null || true
            fi
          done

          if ! git diff --quiet; then
            git add -A
            git commit -m "mirror: redact secrets blocked by push protection"
          fi

          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT


      - name: Open or update mirror PR
        if: steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          AHEAD="${{ steps.diff.outputs.ahead }}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Mirror: $AHEAD new commit(s) from mamoo85/m2training" \
            --body "Auto-mirrored from \`mamoo85/m2training@main\`. CI will run lint, type-check, and tests. Merge to publish via Lovable." \
            || echo "PR may already exist for this branch."

      - name: Report status
        if: always()
        run: |
          echo "Ahead: ${{ steps.diff.outputs.ahead }}"
          echo "Branch: ${{ steps.branch.outputs.branch || 'none' }}"
