name: Cron Pattern Guard

# Fails the build if any NEW migration re-introduces banned cron patterns
# that previously caused 100% silent failure (Phase 13/15/17 disasters).
# Safe to ship: scoped to supabase/migrations/, allow-lists historical files.
#
# See: mem://tech/cron-sentinel-and-monitoring + mem://tech/cron-safety-layer

on:
  pull_request:
    paths:
      - 'supabase/migrations/**.sql'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed migrations
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" -- 'supabase/migrations/*.sql' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Scan for banned cron patterns
        run: |
          set -e
          FILES="${{ steps.diff.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No new/modified migrations. Skip."
            exit 0
          fi

          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            echo "Scanning $f"

            # Banned: app.supabase_url returns NULL inside cron context
            if grep -nE "current_setting\(\s*'app\.supabase_url'" "$f"; then
              echo "::error file=$f::BANNED: current_setting('app.supabase_url') returns NULL in pg_cron. Use hardcoded URL."
              FAIL=1
            fi

            # Banned: vault keys that don't exist in this project
            if grep -nE "vault\.decrypted_secrets[^;]*name\s*=\s*'(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|service_role_key|project_url)'" "$f"; then
              echo "::error file=$f::BANNED: vault key name does not exist. Use 'SUPABASE_SERVICE_ROLE_KEY_VAULT' or call public.safe_cron_schedule()."
              FAIL=1
            fi

            # Banned: literal NULL bearer
            if grep -nE "Bearer\s+NULL" "$f"; then
              echo "::error file=$f::BANNED: literal 'Bearer NULL' in cron command."
              FAIL=1
            fi
          done <<< "$FILES"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "❌ Cron pattern guard failed. See mem://tech/cron-sentinel-and-monitoring for the approved pattern."
            exit 1
          fi
          echo "✅ All scanned migrations clean."
