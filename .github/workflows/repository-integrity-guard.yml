name: Repository Integrity Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block accidental mass deletion of core app files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit; skipping deletion guard."
            exit 0
          fi

          DELETED=$(git diff --name-only --diff-filter=D "$BASE" "$HEAD" -- \
            'src/**' 'supabase/functions/**' 'supabase/migrations/**' '.github/workflows/**' | wc -l | tr -d ' ')

          echo "Deleted protected files: $DELETED"
          if [ "$DELETED" -ge 25 ]; then
            echo "::error::Blocked suspicious mass deletion of protected app/backend files. If intentional, split the removal into a reviewed PR."
            git diff --name-only --diff-filter=D "$BASE" "$HEAD" -- \
              'src/**' 'supabase/functions/**' 'supabase/migrations/**' '.github/workflows/**' | head -100
            exit 1
          fi

      - name: Verify required project directories exist
        run: |
          set -euo pipefail
          test -d src/pages
          test -d supabase/functions
          test -d supabase/migrations
          test -f .github/workflows/deploy-supabase.yml
          test -f .github/workflows/register-actions.yml