name: Deploy Supabase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run database migrations
        run: supabase db push --project-ref zmyczlfuufhngzovkjdh

      - name: Sync secrets to Supabase
        run: |
          supabase secrets set --project-ref zmyczlfuufhngzovkjdh \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
            TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
            TWILIO_PHONE_NUMBER="${{ secrets.TWILIO_PHONE_NUMBER }}" \
            META_ACCESS_TOKEN="${{ secrets.META_ACCESS_TOKEN }}" \
            LINKEDIN_ACCESS_TOKEN="${{ secrets.LINKEDIN_ACCESS_TOKEN }}" \
            N8N_MCP_URL="${{ secrets.N8N_MCP_URL }}" \
            N8N_ACCESS_TOKEN="${{ secrets.N8N_ACCESS_TOKEN }}" \
            LOVABLE_API_KEY="${{ secrets.LOVABLE_API_KEY }}" \
            TWILIO_API_KEY="${{ secrets.TWILIO_API_KEY }}"

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref zmyczlfuufhngzovkjdh
