name: Deploy Supabase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (frontend unit tests)
        run: npm run test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno edge function tests
        run: |
          deno test --allow-env supabase/functions/stripe-webhook/index_test.ts
          deno test --allow-env supabase/functions/stripe-webhook/checkout_routing_test.ts
          deno test --allow-env supabase/functions/dead-lead-drip/index_test.ts
          deno test --allow-env supabase/functions/handle-dead-lead-reply/index_test.ts
          deno test --allow-env supabase/functions/create-hire-alert-checkout/index_test.ts
          deno test --allow-env supabase/functions/hire-alert-scanner/index_test.ts
          deno test --allow-env supabase/functions/_shared/lead-verifier_test.ts
          deno test --allow-env --allow-net --allow-read supabase/functions/env-validator/index_test.ts

      - name: Orphan page scan (advisory)
        run: npx tsx scripts/orphan-scan.ts || true

  deploy-primary:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRIMARY_REF: eauvubfpanpeuxsrqesu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending DB migrations to primary project
        run: supabase db push --project-ref $PRIMARY_REF
        continue-on-error: true
      - name: Deploy mortgage-radar-am-digest
        run: supabase functions deploy mortgage-radar-am-digest --project-ref $PRIMARY_REF --no-verify-jwt
      - name: Deploy mortgage-radar-scanner
        run: supabase functions deploy mortgage-radar-scanner --project-ref $PRIMARY_REF --no-verify-jwt
      - name: Deploy run-migration-once
        run: supabase functions deploy run-migration-once --project-ref $PRIMARY_REF --no-verify-jwt
      - name: Deploy start-radar-trial
        run: supabase functions deploy start-radar-trial --project-ref $PRIMARY_REF --no-verify-jwt
      - name: Deploy trade-radar-scanner
        run: supabase functions deploy trade-radar-scanner --project-ref $PRIMARY_REF --no-verify-jwt
      - name: Deploy create-trade-radar-checkout
        run: supabase functions deploy create-trade-radar-checkout --project-ref $PRIMARY_REF --no-verify-jwt
      - name: Deploy stripe-webhook
        run: supabase functions deploy stripe-webhook --project-ref $PRIMARY_REF --no-verify-jwt
      - name: Deploy trade-radar-health-check
        run: supabase functions deploy trade-radar-health-check --project-ref $PRIMARY_REF --no-verify-jwt

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zmyczlfuufhngzovkjdh
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Remove unused edge functions (zero-client products, confirmed via SQL)
        run: |
          # Wave 3/4/5 niche products — 0 paying clients confirmed
          supabase functions delete ag-price-alerts --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete ai-automated-bots --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete ai-churn-preventer --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete ai-price-monitor-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete battlecard-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete bid-intel-scan --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete churn-radar --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete collections-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete competitor-report --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-abandoned-cart-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-church-newsletter-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-client-report-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-crime-digest-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-direct-mail-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-estimate-drip-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-foundation-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-google-qa-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-hoa-secretary-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-hoa-violation-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-insurance-drip-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-landlord-letters-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-market-intel-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-new-hire-check-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-obituary-service-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-onboarding-agent-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-payment-chaser-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-promo-planner-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-quote-followup-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-reactivation-email-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-report-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-review-responder-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-speed-lead-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-storm-lead-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-testimonial-harvester-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-video-script-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-voicemail-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete create-welcome-drip-checkout --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete financial-advisor-content-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete grant-finder-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete license-expiry-checker --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete monthly-client-report --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete multi-service-drip --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete new-mover-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete permit-watch-scanner --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete podcast-pitch-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete re-newsletter-add-contacts --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete re-newsletter-send --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete real-estate-drip-sender --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete recall-alert-checker --project-ref $SUPABASE_PROJECT_REF || true
          supabase functions delete text-marketing-sender --project-ref $SUPABASE_PROJECT_REF || true

      - name: Deploy contractor-lead-notify edge function
        run: |
          supabase functions deploy contractor-lead-notify --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt

      - name: Deploy missed-call-handler edge function
        run: |
          supabase functions deploy missed-call-handler --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt

      - name: Deploy missed-call-status edge function
        run: |
          supabase functions deploy missed-call-status --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt

      - name: Deploy inbound-sms-relay edge function
        run: |
          supabase functions deploy inbound-sms-relay --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt

      - name: Sync secrets to Supabase
        run: |
          supabase secrets set --project-ref $SUPABASE_PROJECT_REF \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
            TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
            TWILIO_PHONE_NUMBER="${{ secrets.TWILIO_PHONE_NUMBER }}" \
            META_ACCESS_TOKEN="${{ secrets.META_ACCESS_TOKEN }}" \
            META_APP_ID="${{ secrets.META_APP_ID }}" \
            META_APP_SECRET="${{ secrets.META_APP_SECRET }}" \
            META_PAGE_ID="${{ secrets.META_PAGE_ID }}" \
            LINKEDIN_ACCESS_TOKEN="${{ secrets.LINKEDIN_ACCESS_TOKEN }}" \
            LINKEDIN_CLIENT_ID="${{ secrets.LINKEDIN_CLIENT_ID }}" \
            LINKEDIN_CLIENT_SECRET="${{ secrets.LINKEDIN_CLIENT_SECRET }}" \
            N8N_MCP_URL="${{ secrets.N8N_MCP_URL }}" \
            N8N_ACCESS_TOKEN="${{ secrets.N8N_ACCESS_TOKEN }}" \
            LOVABLE_API_KEY="${{ secrets.LOVABLE_API_KEY }}" \
            TWILIO_API_KEY="${{ secrets.TWILIO_API_KEY }}" \
            NOAA_API_KEY="${{ secrets.NOAA_API_KEY }}" \
            GOOGLE_PAGESPEED_API_KEY="${{ secrets.GOOGLE_PAGESPEED_API_KEY }}" \
            GOOGLE_CALENDAR_ID="${{ secrets.GOOGLE_CALENDAR_ID }}" \
            GOOGLE_SERVICE_ACCOUNT_KEY="${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}" \
            GOOGLE_PRIVATE_KEY_B64="${{ secrets.GOOGLE_PRIVATE_KEY_B64 }}" \
            DATAFORSEO_LOGIN="${{ secrets.DATAFORSEO_LOGIN }}" \
            DATAFORSEO_PASSWORD="${{ secrets.DATAFORSEO_PASSWORD }}" \
            FIRECRAWL_API_KEY="${{ secrets.FIRECRAWL_API_KEY }}" \
            ADMIN_PHONE_NUMBER="${{ secrets.ADMIN_PHONE_NUMBER }}" \
            APP_BASE_URL="${{ secrets.APP_BASE_URL }}"
