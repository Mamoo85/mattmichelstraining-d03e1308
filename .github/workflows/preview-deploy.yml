name: PR Preview Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Lovable auto-creates a preview environment for every branch pushed to the
# Lovable-managed repo: https://<branch>--<project-id>.lovable.app
# This workflow builds the PR, verifies the bundle, and posts the preview URL
# as a sticky PR comment so reviewers can click straight through.

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Compute preview URL
        id: url
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE=$(echo "$BRANCH" | tr '/_' '--' | tr '[:upper:]' '[:lower:]')
          echo "url=https://${SAFE}--0b29f43e-9e42-4097-9d97-f85f419ccc8e.lovable.app" >> $GITHUB_OUTPUT
      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lovable-preview
          message: |
            ### Lovable Preview Ready

            **Preview:** ${{ steps.url.outputs.url }}
            **Commit:** `${{ github.event.pull_request.head.sha }}`

            Build, lint, type-check, and tests run in the CI workflow.
            Merge once green and the change auto-publishes.
