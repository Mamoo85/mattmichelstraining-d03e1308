<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <path id="outerRing" d="M120,120 m-95,0 a95,95 0 1,1 190,0 a95,95 0 1,1 -190,0"/>
  </defs>

  <!-- Outer circle fill -->
  <circle cx="120" cy="120" r="115" fill="#7A9E7E"/>
  <!-- Inner circle white -->
  <circle cx="120" cy="120" r="98" fill="white"/>
  <!-- Decorative inner ring -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#7A9E7E" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Outer ring text path -->
  <path id="topArc" d="M 28,120 A 92,92 0 0,1 212,120"/>
  <path id="bottomArc" d="M 38,145 A 92,92 0 0,0 202,145"/>

  <!-- Ring text - top arc -->
  <text font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="3.5">
    <textPath href="#topArc" startOffset="5%">SAINT CLAIR SHORES · MICHIGAN ·</textPath>
  </text>

  <!-- Ring text - bottom label in green ring -->
  <text x="120" y="205" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7A9E7E" text-anchor="middle" letter-spacing="2">MADE WITH LOVE</text>

  <!-- Dog silhouette in center -->
  <!-- Body -->
  <ellipse cx="120" cy="118" rx="28" ry="22" fill="none" stroke="#C4703D" stroke-width="2.5"/>
  <!-- Head -->
  <circle cx="148" cy="100" r="16" fill="none" stroke="#C4703D" stroke-width="2.5"/>
  <!-- Ear left -->
  <ellipse cx="138" cy="88" rx="7" ry="11" fill="none" stroke="#C4703D" stroke-width="2" transform="rotate(-20 138 88)"/>
  <!-- Ear right -->
  <ellipse cx="158" cy="88" rx="7" ry="11" fill="none" stroke="#C4703D" stroke-width="2" transform="rotate(20 158 88)"/>
  <!-- Nose dot -->
  <circle cx="155" cy="103" r="2.5" fill="#C4703D"/>
  <!-- Tail -->
  <path d="M92 108 Q78 90 84 78" fill="none" stroke="#C4703D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Front legs -->
  <line x1="108" y1="136" x2="106" y2="154" stroke="#C4703D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="138" x2="118" y2="156" stroke="#C4703D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Back legs -->
  <line x1="128" y1="136" x2="130" y2="154" stroke="#C4703D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="138" y1="134" x2="142" y2="152" stroke="#C4703D" stroke-width="2.5" stroke-linecap="round"/>

  <!-- PETfection text at bottom of circle -->
  <text x="120" y="185" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="#C4703D" text-anchor="middle" letter-spacing="-0.3">PET</text>
  <text x="120" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#7A9E7E" text-anchor="middle" dx="22">fection</text>
</svg>
