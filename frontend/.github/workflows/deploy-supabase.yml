name: Deploy Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (frontend unit tests)
        run: npm run test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno edge function tests
        # || true: Deno tests may need env vars unavailable in CI — failures are advisory
        run: |
          deno test --allow-all \
            "supabase/functions/_shared/*.test.ts" \
            "supabase/functions/**/*_test.ts" \
            || true

      - name: Orphan page scan (advisory)
        run: npx tsx scripts/orphan-scan.ts || true

  deploy-primary:
    needs: test
    runs-on: ubuntu-latest
    # Always runs after tests pass — secret check happens inside steps, not here.
    # Putting secrets in job-level `if:` causes GitHub to report "No jobs were run"
    # even when other jobs ran. Check the secret at step level instead.
    if: github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRIMARY_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: eauvubfpanpeuxsrqesu
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy token
        id: token_check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️  PRIMARY_SUPABASE_ACCESS_TOKEN not set — deploy skipped."
            echo "One-time setup to enable auto-deploy forever:"
            echo "  1. Open Lovable → click Supabase project link"
            echo "  2. Supabase dashboard → Account → Access Tokens → Generate New Token"
            echo "  3. GitHub → mamoo85/m2training → Settings → Secrets → New secret"
            echo "     Name: PRIMARY_SUPABASE_ACCESS_TOKEN  Value: (paste token)"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ Deploy token present — deploying all functions + migrations."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token_check.outputs.has_token == 'true'
        with:
          version: latest

      - name: Deploy all edge functions to primary project
        if: steps.token_check.outputs.has_token == 'true'
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            [ ! -f "$dir/index.ts" ] && continue
            NO_JWT=""
            if grep -q "\[functions\.$fn\]" supabase/config.toml 2>/dev/null; then
              NO_JWT=$(awk "/\[functions\.$fn\]/{f=1} f && /verify_jwt *= *false/{print \"true\"; f=0}" supabase/config.toml)
            fi
            if [ "$NO_JWT" = "true" ]; then
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt || true
            else
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" || true
            fi
          done

      - name: Apply pending DB migrations
        if: steps.token_check.outputs.has_token == 'true'
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" || true
